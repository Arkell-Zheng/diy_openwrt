name: Build OpenWrt for Redmi AC2100

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev libssl-dev libelf-dev zlib1g-dev python3 python3-pip python3-setuptools rsync unzip file wget curl ccache cmake ninja-build zstd squashfs-tools
          sudo timedatectl set-timezone $TZ
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -hT

      - name: Clone LEDE source
        working-directory: /workdir
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          cp config/feeds.conf openwrt/feeds.conf.default
          chmod +x scripts/diy-part1.sh scripts/diy-part2.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part1.sh

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        run: |
          if [ -d files ]; then mv files openwrt/files; fi
          cp config/redmi-ac2100.config openwrt/.config
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part2.sh
          make defconfig
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config || { echo ERROR: no target device selected; exit 1; }

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -delete

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
          make target/linux/install V=s 2>&1 | tee -a build.log || true
          echo FILE_DATE=$(date +%Y%m%d%H%M) >> $GITHUB_ENV
          find bin/targets -type f -name '*.bin' -exec ls -lh {} + || true
          if find bin/targets -type f -name '*sysupgrade.bin' -print -quit | grep -q .; then
            echo status=success >> $GITHUB_OUTPUT
          else
            echo ERROR: no sysupgrade firmware generated
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect firmware
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          for f in $(find openwrt/bin/targets -type f -name '*.bin'); do cp $f $GITHUB_WORKSPACE/firmware/; done
          ls -lh $GITHUB_WORKSPACE/firmware
          ls -A $GITHUB_WORKSPACE/firmware | grep -q . || { echo ERROR: firmware directory empty; exit 1; }

      - name: Upload firmware artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_AC2100_${{ env.FILE_DATE }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ac2100-${{ env.FILE_DATE }}
          name: Redmi AC2100 OpenWrt ${{ env.FILE_DATE }}
          body: |
            Target: ramips/mt7621 / xiaomi_redmi-router-ac2100
            Default LAN 192.168.31.1, user root, no password.
            WiFi: RedmiAC2100_2.4G / RedmiAC2100_5G, key 12345678.
            sysupgrade.bin for upgrade, factory.bin for stock firmware.
            WARNING: flashing may brick the device, back up first.
          files: firmware/*
#===============================================================================
# OpenWrt 自动编译工作流
# 设备目标: 红米AC2100 (xiaomi_redmi-router-ac2100)
# 触发方式: 手动触发 / 定时触发 / Push触发
#===============================================================================

name: Build OpenWrt for Redmi AC2100

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启SSH调试'
        required: false
        default: 'false'
        type: boolean
      clean_build:
        description: '是否清理后重新编译'
        required: false
        default: 'false'
        type: boolean

  # 定时触发 (每周日凌晨2点)
  schedule:
    - cron: '0 18 * * 0'  # UTC时间，对应北京时间周一凌晨2点

  # Push 触发 (修改配置文件时)
  push:
    branches:
      - main
      - master
    paths:
      - 'config/*.config'
      - 'scripts/diy-*.sh'
      - '.github/workflows/build-openwrt.yml'

env:
  # 源码仓库配置
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  # 配置文件路径
  FEEDS_CONF: config/feeds.conf
  CONFIG_FILE: config/redmi-ac2100.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

  # 上传选项
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  # 时区设置
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    #===========================================================================
    # 1. 检出代码
    #===========================================================================
    - name: Checkout
      uses: actions/checkout@v4

    #===========================================================================
    # 2. 初始化环境
    #===========================================================================
    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理 Docker 镜像释放空间
        docker rmi $(docker images -q) 2>/dev/null || true

        # 清理不需要的软件包
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo rm -rf /opt/ghc /usr/local/share/boost

        # 更新系统
        sudo -E apt-get -qq update
        sudo -E apt-get -qq upgrade -y

        # 安装编译依赖
        sudo -E apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
          ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
          gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-pyelftools python3-setuptools qemu-utils re2c rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
          xmlto xxd zlib1g-dev zstd

        # 清理
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        # 设置时区
        sudo timedatectl set-timezone "$TZ"

        # 创建工作目录
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

        # 显示磁盘空间
        df -hT

    #===========================================================================
    # 3. 克隆源码
    #===========================================================================
    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    #===========================================================================
    # 4. 加载自定义 Feeds
    #===========================================================================
    - name: Load Custom Feeds
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    #===========================================================================
    # 5. 更新和安装 Feeds
    #===========================================================================
    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    #===========================================================================
    # 6. 加载自定义配置
    #===========================================================================
    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    #===========================================================================
    # 7. SSH 调试 (可选)
    #===========================================================================
    - name: SSH Connection (Debug)
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    #===========================================================================
    # 8. 下载软件包
    #===========================================================================
    - name: Download Packages
      id: download
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    #===========================================================================
    # 9. 编译固件
    #===========================================================================
    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

        # 提取设备名称
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV

        # 记录编译日期
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    #===========================================================================
    # 10. 检查磁盘空间
    #===========================================================================
    - name: Check Disk Space
      if: always()
      run: df -hT

    #===========================================================================
    # 11. 上传 Bin 目录
    #===========================================================================
    - name: Upload Bin Directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    #===========================================================================
    # 12. 整理固件文件
    #===========================================================================
    - name: Organize Firmware Files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*

        # 删除不需要的文件
        rm -rf packages
        rm -f *.buildinfo
        rm -f *.manifest
        rm -f sha256sums

        # 重命名固件文件（添加日期）
        for file in *.bin; do
          if [ -f "$file" ]; then
            newname="${file%.bin}_${{ env.FILE_DATE }}.bin"
            mv "$file" "$newname"
          fi
        done

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    #===========================================================================
    # 13. 上传固件
    #===========================================================================
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    #===========================================================================
    # 14. 生成 Release Tag
    #===========================================================================
    - name: Generate Release Tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=v$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

        # 生成更新日志
        cat >> release.txt << EOF
        ## 红米AC2100 OpenWrt 固件

        ### 编译信息
        - **编译日期**: $(date +"%Y-%m-%d %H:%M")
        - **源码仓库**: $REPO_URL
        - **源码分支**: $REPO_BRANCH
        - **设备名称**: ${{ env.DEVICE_NAME }}

        ### 固件说明
        - \`*-sysupgrade.bin\` - 系统升级固件（已有OpenWrt时使用）
        - \`*-factory.bin\` - 全新刷机固件（从原厂固件刷入时使用）

        ### 默认配置
        - **管理地址**: 192.168.31.1
        - **默认用户**: root
        - **默认密码**: 无（首次登录设置）
        - **WiFi名称**: RedmiAC2100_2.4G / RedmiAC2100_5G
        - **WiFi密码**: 12345678

        ### 内置功能
        - PassWall 科学上网
        - AdGuard Home 广告屏蔽
        - Aria2 下载工具
        - SmartDNS 智能DNS
        - frpc 内网穿透
        - ZeroTier 组网
        - Samba 文件共享
        - 流量统计监控
        - 等更多功能...

        ### 注意事项
        ⚠️ 刷机有风险，请提前备份原固件
        ⚠️ 首次登录请立即修改密码和WiFi密码
        EOF

        echo "status=success" >> $GITHUB_OUTPUT

    #===========================================================================
    # 15. 发布 Release
    #===========================================================================
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    #===========================================================================
    # 16. 清理旧的 Workflow Runs
    #===========================================================================
    - name: Delete Old Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 5

    #===========================================================================
    # 17. 删除旧的 Releases
    #===========================================================================
    - name: Delete Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.2
      if: env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
